name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: master

      - name: Setup kcov
        if: github.repository_owner == 'zigtools' && matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf
          wget https://github.com/SimonKagstrom/kcov/releases/download/v42/kcov-amd64.tar.gz
          echo "78aa17a5f6d27a867cc0540b1550051591d350423a1a0ef98d63c9ce7cc10f9d  kcov-amd64.tar.gz" | sha256sum --check
          sudo tar xf kcov-amd64.tar.gz -C /
          sudo patchelf --replace-needed libopcodes-2.38-system.so libopcodes-2.46-system.so --replace-needed libbfd-2.38-system.so libbfd-2.46-system.so $(which kcov)

      - name: Check Formatting
        run: zig fmt --ast-check --check src

      - name: Run Tests
        run: zig build test --summary all

      - name: Build Examples
        run: zig build --summary all

      - name: Collect Coverage
        if: github.repository_owner == 'zigtools' && matrix.os == 'ubuntu-latest'
        run: zig build coverage -Duse-llvm --summary all

      - name: Upload coverage reports to Codecov
        if: github.repository_owner == 'zigtools' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          directory: zig-out/coverage/kcov-merged
          fail_ci_if_error: true
          verbose: true
